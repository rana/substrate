[project]
name = "substrate"
version = "0.1.0"
description = "A runtime environment for collaborative intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rana" }]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.8",
]

[project.scripts]
sub = "substrate.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
